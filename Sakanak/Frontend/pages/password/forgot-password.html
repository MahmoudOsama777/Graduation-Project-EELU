<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Sakanak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/password-forget/style.css" />
</head>
<body>

  <header class="top-bar">
    <a href="../login/login.html" class="back-link">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M11 6l-6 6 6 6" />
      </svg>
      Back to Login
    </a>

    <a href="../../../../index.html" class="logo" aria-label="Sakanak home">
      <span class="logo-text">Sak<span>anak</span></span>
      <span class="logo-icon">
      <span class="logo-icon">
          <img src="../../assets/images/logo.png" alt="logo" class="logo-img" width="40" height="40">
      </span>
    </a>
  </header>

  <main class="center">
    <section class="card">
      <div class="key-icon" aria-hidden="true">🔑</div>
      <h1>Forgot Password?</h1>
      <p class="intro">No worries! Enter your registered mobile number or email address and we will send you a reset link or verification code.</p>

      <form id="forgotForm" novalidate>
        <label for="identifier">Email or Mobile Number *</label>
        <input
          type="text"
          id="identifier"
          name="identifier"
          placeholder="e.g. 01012345678 or email@example.com"
          autocomplete="username"
          required
        />
        <p class="field-msg" id="fieldMsg" role="alert" aria-live="polite"></p>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="btn-label">Send Reset Code</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="success-box" id="successBox" hidden>
        <strong>Code sent!</strong>
        <span id="successText"></span>
      </div>

      <p class="login-line">
        Remembered your password? <a href="../login/login.html">Log In Now</a>
      </p>
    </section>
  </main>

  <footer class="page-footer">© 2026 Sakanak - Password Recovery Portal</footer>

  <script src="../../js/password-forget/main.js"></script>
</body>
</html>
